<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Mario Bros</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="mario_favicon" href="mario_favicon.jpg">
</head>
<body>
  <canvas id="canvas" width="512" height="480"></canvas>

  <div id="start-screen" class="overlay">
    <h1>SUPER MARIO BROS</h1>
    <button id="start-btn">START GAME</button>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1>GAME OVER</h1>
    <p id="final-stats"></p>
    <button id="retry-btn">RETRY</button>
  </div>

  <div id="clear-screen" class="overlay hidden">
    <h1>STAGE CLEARED!</h1>
    <p id="clear-stats"></p>
    <div class="btn-group">
      <button id="replay-btn">REPLAY LEVEL</button>
      <button id="next-btn">NEXT LEVEL</button>
    </div>
  </div>

  <div id="win-screen" class="overlay hidden">
    <h1>YOU WIN!</h1>
    <p id="win-stats"></p>
    <button id="win-replay-btn">PLAY AGAIN</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
